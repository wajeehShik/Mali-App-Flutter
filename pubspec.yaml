name: mali
description: مالي - إدارة الأموال ونقاط البيع والتجارة الصغيرة.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.0 # أبقِ القيمة الموجودة في ملفك الأصلي

dependencies:
  cryptography: ^2.9.0
  device_info_plus: ^13.3.0
  drift: ^2.35.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^11.2.0
  go_router: ^17.5.0
  intl: any
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3_flutter_libs: ^0.6.0+eol
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/keys/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700